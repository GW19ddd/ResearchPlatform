<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研工作台 · 创新点（优化原型）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M7 17V7h10M7 12h7' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f4f1;
    --surface:#ffffff;
    --ink:#1a1a18;
    --ink-2:#55554f;
    --ink-3:#8a8a82;
    --line:#e7e7e2;
    --line-2:#efefeb;
    --accent:#4f46e5;
    --accent-soft:#eef0ff;
    --accent-ink:#3d3dc4;
    --green:#15803d; --green-soft:#e8f5ec;
    --amber:#b45309; --amber-soft:#fdf1e0;
    --red:#b91c1c;   --red-soft:#fdecec;
    --radius:10px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  /* ===== 应用骨架 ===== */
  .shell{display:flex;min-height:100vh}
  /* 侧边栏 */
  .side{
    width:232px;flex:0 0 232px;background:var(--surface);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
  .brand-name{font-weight:600;font-size:14px;line-height:1.2}
  .brand-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
  .nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
  .nav-group{margin-top:12px}
  .nav-label{font-size:11px;color:var(--ink-3);padding:4px 10px 6px;letter-spacing:.5px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;
    color:var(--ink-2);cursor:pointer;font-size:13.5px;position:relative;
  }
  .nav-item:hover{background:#f6f6f3}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .nav-badge{
    margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:500;
    background:#eee;font-size:11px;color:var(--ink-2);padding:1px 7px;border-radius:9px;
  }
  .nav-badge.hot{background:var(--accent);color:#fff}
  .nav-badge.warn{background:var(--amber-soft);color:var(--amber)}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
  .side-foot .row{display:flex;justify-content:space-between;margin-top:3px}
  /* 主区 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;gap:16px;
    position:sticky;top:0;z-index:5;
  }
  .page-title{font-size:18px;font-weight:700}
  .page-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .top-search{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    background:#f4f4f1;border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;width:280px;color:var(--ink-3);font-size:13px;cursor:text;
  }
  .top-search kbd{font-family:var(--mono);font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:auto;color:var(--ink-2)}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{background:#f6f6f3}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-ink)}
  .content{padding:22px 28px 60px;max-width:1180px;width:100%;margin:0 auto}
  /* ===== 快速捕获条 ===== */
  .capture{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;gap:10px;align-items:center;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .capture input{
    flex:1;border:none;outline:none;font-size:14.5px;font-family:inherit;
    background:transparent;color:var(--ink);
  }
  .capture input::placeholder{color:var(--ink-3)}
  .capture .hint{font-size:12px;color:var(--ink-3);white-space:nowrap}
  /* ===== 工具栏 ===== */
  .toolbar{display:flex;align-items:center;gap:10px;margin:20px 0 12px;flex-wrap:wrap}
  .chip{
    padding:5px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
  }
  .chip:hover{border-color:#cfcfc8}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toolbar .spacer{flex:1}
  .select{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:6px 10px;font-size:12.5px;color:var(--ink-2);font-family:inherit;cursor:pointer;
  }
  .stats{font-size:12.5px;color:var(--ink-3)}
  .stats b{color:var(--ink);font-family:var(--mono);font-weight:600}
  /* ===== 想法列表 ===== */
  .idea{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;
    transition:border-color .15s;
  }
  .idea:hover{border-color:#d8d8d2}
  .score{
    flex:0 0 52px;height:52px;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:var(--mono);
  }
  .score .num{font-size:19px;font-weight:700;line-height:1}
  .score .lab{font-size:9.5px;margin-top:3px;opacity:.75;letter-spacing:.5px}
  .score.hi{background:var(--green-soft);color:var(--green)}
  .score.mid{background:var(--accent-soft);color:var(--accent-ink)}
  .score.lo{background:var(--amber-soft);color:var(--amber)}
  .idea-body{flex:1;min-width:0}
  .idea-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .idea-title{font-weight:600;font-size:14.5px}
  .tag{font-size:11px;color:var(--ink-3);background:#f2f2ee;padding:1px 8px;border-radius:5px}
  .status{
    font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:500;
  }
  .status.verified{background:var(--green-soft);color:var(--green)}
  .status.captured{background:var(--accent-soft);color:var(--accent-ink)}
  .status.open{background:#f0f0ec;color:var(--ink-2)}
  .claim{color:var(--ink-2);font-size:13px;margin-top:5px;line-height:1.55}
  .claim b{color:var(--ink-2);font-weight:600}
  .bars{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .bar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
  .bar .track{display:flex;gap:2px}
  .bar .dot{width:8px;height:8px;border-radius:2px;background:#e3e3dd}
  .bar .dot.on{background:var(--accent)}
  .bar .v{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .idea-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .mini{
    font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:4px 9px;cursor:pointer;color:var(--ink-2);font-family:inherit;white-space:nowrap;
  }
  .mini:hover{border-color:var(--accent);color:var(--accent-ink)}
  .mini.done{background:#f6f6f3;color:var(--ink-3);text-decoration:line-through}
  /* 空态 */
  .empty{
    text-align:center;padding:48px 20px;color:var(--ink-3);
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty p{margin-top:8px;font-size:13px}
  /* toast */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:99;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 响应式 */
  @media (max-width:880px){
    .side{display:none}
    .top-search{display:none}
    .content{padding:16px}
    .idea{flex-wrap:wrap}
    .idea-actions{flex-direction:row;flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ===== 侧边栏 ===== -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">研</div>
      <div>
        <div class="brand-name">科研工作台</div>
        <div class="brand-sub">创新 · 文献 · 实验</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <div class="nav-label">输入</div>
        <div class="nav-item" data-t="今日"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日</div>
        <div class="nav-item active" data-t="创新点"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10c.8.7 1 1.5 1 2h6c0-.5.2-1.3 1-2a6 6 0 0 0-4-10z"/></svg>创新点<span class="nav-badge hot">9</span></div>
        <div class="nav-item" data-t="文献"><svg viewBox="0 0 24 24"><path d="M4 5h13a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5z"/><path d="M4 16a3 3 0 0 1 3-3h13"/></svg>文献<span class="nav-badge warn">103</span></div>
        <div class="nav-item" data-t="科研导航"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>科研导航</div>
      </div>
      <div class="nav-group">
        <div class="nav-label">执行</div>
        <div class="nav-item" data-t="实验"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5.5 17a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 9V3"/></svg>实验<span class="nav-badge">2</span></div>
        <div class="nav-item" data-t="论文"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7zM9 8h6M9 12h6M9 16h4"/></svg>论文</div>
        <div class="nav-item" data-t="科研画布"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9M8 6h8"/></svg>科研画布</div>
      </div>
      <div class="nav-group">
        <div class="nav-label">复盘</div>
        <div class="nav-item" data-t="计划复盘"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>计划复盘</div>
        <div class="nav-item" data-t="导师"><svg viewBox="0 0 24 24"><path d="M5 5h4l2 4-2 1a11 11 0 0 0 5 5l1-2 4 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 7a2 2 0 0 1 2-2z"/></svg>导师<span class="nav-badge warn">1</span></div>
      </div>
      <div class="nav-group">
        <div class="nav-label">激励</div>
        <div class="nav-item" data-t="积分"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M9 14l-1.5 6L12 18l4.5 2L15 14"/></svg>积分</div>
        <div class="nav-item" data-t="对话"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>对话</div>
        <div class="nav-item" data-t="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.3 2.6a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.3 2.6h4l.3-2.6a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>设置</div>
      </div>
    </nav>
    <div class="side-foot">
      <div class="row"><span>DeepSeek 本月</span><span>56 次</span></div>
      <div class="row"><span>剩余额度</span><span style="color:var(--green);font-family:var(--mono)">充足</span></div>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title">创新点</div>
        <div class="page-sub">捕获 → 质疑 → 选定：想法先过三关，再进实验</div>
      </div>
      <div class="top-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索想法、文献、实验…<kbd>⌘K</kbd></div>
      <button class="btn btn-primary" onclick="toast('已打开 AI 头脑风暴（原型示意）')">＋ AI 头脑风暴</button>
    </header>

    <div class="content">

      <!-- 快速捕获：替代原来的大表单 -->
      <div class="capture">
        <input id="quickInput" placeholder="一闪而过的想法？先一句话记下来，之后再补评分…" />
        <button class="btn btn-primary" onclick="addIdea()">捕获</button>
        <span class="hint">Enter 快速入库</span>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <span class="chip on" data-f="all">全部 9</span>
        <span class="chip" data-f="open">未验证 4</span>
        <span class="chip" data-f="captured">已捕获 4</span>
        <span class="chip" data-f="verified">已验证 1</span>
        <span class="spacer"></span>
        <span class="stats">平均综合分 <b id="avgScore">—</b></span>
        <select class="select" id="sortSel">
          <option value="score">按综合分 ↓</option>
          <option value="new">按录入时间 ↓</option>
        </select>
      </div>

      <!-- 想法列表（由 JS 渲染） -->
      <div id="list"></div>

    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  // 数据：来自截图中可见的 4 条（综合分按截图显示值）
  var ideas = [
    {
      id:1, title:"测试创新点", status:"verified", score:3.3,
      claim:"（一句话主张）",
      ratings:{novel:4, feas:3, impact:3, work:3},
      challenges:{reviewer:false, advisor:false, peer:false}
    },
    {
      id:2, title:"缺陷复现导向评测", status:"captured", score:4.3,
      claim:"把生成目标从「提高覆盖率」改成「修复前版本失败、在修复后版本通过」，并以该联合条件作为唯一筛选与评测指标，量化覆盖率提升与真实缺陷检出之间的落差。<b>ai生成python单元测试</b>",
      ratings:{novel:4, feas:4, impact:5, work:4},
      challenges:{reviewer:false, advisor:false, peer:false}
    },
    {
      id:3, title:"抗 flaky 的测试生成", status:"captured", score:4.0,
      claim:"用确定性扰动矩阵（PYTHONHASHSEED 轮换、注入假超时、禁用网络、随机种子切换、文件系统隔离）作为生成后门，只保留在全矩阵下稳定通过的用例，以 flakiness rate 为判据。<b>ai生成python单元测试</b>",
      ratings:{novel:4, feas:5, impact:3, work:2},
      challenges:{reviewer:false, advisor:false, peer:false}
    },
    {
      id:4, title:"仓库接地可运行生成", status:"captured", score:4.0,
      claim:"生成前检索 confest.py、fixture 定义、同目录既有测试风格与 import 依赖图注入上下文；把「无人丁编辑的首次运行通过率」作为唯一优化与评测目标。",
      ratings:{novel:4, feas:4, impact:4, work:3},
      challenges:{reviewer:false, advisor:false, peer:false}
    }
  ];

  var filter = "all";
  var listEl = document.getElementById("list");
  var sortSel = document.getElementById("sortSel");

  function scoreClass(s){ return s>=4.0 ? "hi" : (s>=3.5 ? "mid" : "lo"); }
  function statusText(s){ return s==="verified" ? "已验证" : (s==="captured" ? "已捕获" : "未验证"); }
  function bar(label, v){
    var dots = "";
    for(var i=1;i<=5;i++) dots += '<span class="dot'+(i<=v?" on":"")+'"></span>';
    return '<span class="bar"><span>'+label+'</span><span class="track">'+dots+'</span><span class="v">'+v+'</span></span>';
  }

  function render(){
    var rows = ideas.filter(function(x){
      if(filter==="all") return true;
      return x.status===filter;
    });
    rows.sort(function(a,b){
      return sortSel.value==="score" ? (b.score-a.score) : (b.id-a.id);
    });

    // 平均分
    var avg = ideas.reduce(function(s,x){return s+x.score;},0)/ideas.length;
    document.getElementById("avgScore").textContent = avg.toFixed(2);

    if(!rows.length){
      listEl.innerHTML = '<div class="empty"><div style="font-size:28px;color:var(--ink-3)">＋</div><p>这个筛选下还没有想法</p></div>';
      return;
    }

    listEl.innerHTML = rows.map(function(x){
      var ch = x.challenges;
      return ''
      +'<div class="idea">'
      +'  <div class="score '+scoreClass(x.score)+'"><div class="num">'+x.score.toFixed(1)+'</div><div class="lab">综合</div></div>'
      +'  <div class="idea-body">'
      +'    <div class="idea-head">'
      +'      <span class="idea-title">'+x.title+'</span>'
      +'      <span class="tag">未分类</span>'
      +'      <span class="status '+x.status+'">'+statusText(x.status)+'</span>'
      +'    </div>'
      +'    <div class="claim">'+x.claim+'</div>'
      +'    <div class="bars">'
      +'      '+bar('新颖', x.ratings.novel)
      +'      '+bar('可行', x.ratings.feas)
      +'      '+bar('影响', x.ratings.impact)
      +'      '+bar('工作量', x.ratings.work)
      +'    </div>'
      +'  </div>'
      +'  <div class="idea-actions">'
      +'    <button class="mini'+(ch.reviewer?" done":"")+'" onclick="toggleCh('+x.id+',\'reviewer\',this)">挑剔审稿人质疑</button>'
      +'    <button class="mini'+(ch.advisor?" done":"")+'" onclick="toggleCh('+x.id+',\'advisor\',this)">务实导师质疑</button>'
      +'    <button class="mini'+(ch.peer?" done":"")+'" onclick="toggleCh('+x.id+',\'peer\',this)">竞争同行质疑</button>'
      +'  </div>'
      +'</div>';
    }).join("");
  }

  window.toggleCh = function(id, key, btn){
    var x = ideas.find(function(i){return i.id===id;});
    x.challenges[key] = !x.challenges[key];
    btn.classList.toggle("done");
    toast(x.challenges[key] ? "已标记质疑（结果将回流到想法详情）" : "已取消质疑标记");
  };

  window.addIdea = function(){
    var v = document.getElementById("quickInput").value.trim();
    if(!v){ toast("先写一句话主张"); return; }
    ideas.unshift({
      id: Date.now(), title: v.length>18 ? v.slice(0,18)+"…" : v,
      claim: v, status:"open", score:3.0,
      ratings:{novel:3,feas:3,impact:3,work:3},
      challenges:{reviewer:false,advisor:false,peer:false}
    });
    document.getElementById("quickInput").value = "";
    render();
    toast("已入库，可在右侧补四维评分");
  };

  document.getElementById("quickInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") addIdea();
  });

  document.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});
      c.classList.add("on");
      filter = c.dataset.f;
      render();
    });
  });

  sortSel.addEventListener("change", render);

  // 侧边栏非激活项：原型提示
  document.querySelectorAll(".nav-item").forEach(function(n){
    n.addEventListener("click", function(){
      if(n.classList.contains("active")) return;
      toast("原型示意：「"+n.dataset.t+"」页未在本次重设计范围内");
    });
  });

  window.toast = function(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__tt);
    window.__tt = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  };

  render();
})();
</script>
</body>
</html>
